name: app_mobile
description: "LearningHub LMS Mobile Application for Students and Lecturers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  equatable: ^2.0.5

  # Networking & Storage
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  table_calendar: ^3.1.2
  shimmer: ^3.0.0

  # Utilities, Camera QR & Biometrics
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  intl: ^0.19.0
  jwt_decoder: ^2.0.1
  url_launcher: ^6.3.1
  mobile_scanner: ^6.0.2
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
